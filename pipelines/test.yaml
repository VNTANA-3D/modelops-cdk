name: s3glboptimization
description: Downloads an asset from S3 and optimizes it using MeshOptimizer
state:
  optimized: /home/workspace/optimized.glb
  suffix: optimized_glb
  extension: glb
  target_tex_density: 3000

  # NOTE: Don't include the extension in the name.
  # name: CLOSED_2MM_Unoptimized
  name: VRC_132_w_Adapter_Plate_text_rmvd
  # NOTE: Make sure the ModelOps Handler has R/W access to this Bucket.
  bucket: gss-demo-catalog
  # NOTE: Pass an empty string if the asset is in the root.
  prefix: modelops
tasks:
  - name: Download Asset
    module: S3
    props:
      src: "{{ prefix }}/{{ name }}.{{ extension }}"
      dest: "{{ name }}.{{ extension }}"
      bucket: "{{ bucket }}"
      action: download
    register: asset
  - module: MeshOptimizer
    props:
      src: "{{ asset.dest }}"
      dest: "{{ optimized }}"
      config:
        c: true
        allow_draco_decode: true
        # c3: true
        # reset_scaling: false
        # pot_textures: true
        # ignore_parallel_geometry: true
        # bake_small_features: false
        # target_tex_density: "{{ target_tex_density }}"
        # output_fbx: false
        # output_usdz: false
        # output_obj: false
        # force_poly_count: true
        # tris: 175000
        # remove_obstructed_geometry: true
    register: optimized
  - name: Debug download output
    module: Debug
    props:
      var: optimized
      format: yaml

  - name: Upload Optimized GLB
    module: S3
    props:
      src: "{{ optimized.dest }}"
      dest: "{{ prefix }}/{{ name }}.{{ suffix }}.glb"
      bucket: "{{ bucket }}"
      action: upload
