specificationVersion: 'jobtemplate-2023-09'
name: '{{jobName}}'
parameterDefinitions:
  - name: PipelineJson
    type: STRING
  - name: Image
    type: STRING
  - name: Logger
    type: STRING
    default: "stdout"
  - name: DebugFlag
    type: STRING
    default: ""

steps:
  - name: RunPipeline
    script:
      actions:
        onRun:
          command: bash
          args:
            - '{{Task.File.RunScript}}'
      embeddedFiles:
        - name: RunScript
          type: TEXT
          runnable: true
          data: |
            #!/bin/bash
            set -euo pipefail
            echo '{{Param.PipelineJson}}' | docker run --rm -i \
              -v "$(pwd):/workspace" \
              '{{Param.Image}}' \
              -i json --logger '{{Param.Logger}}' {{Param.DebugFlag}}
